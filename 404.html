<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>404 | Stránka nenalezena</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;

      min-height:100vh;

      overflow:hidden;

      display:flex;
      align-items:center;
      justify-content:center;

      position:relative;

      background:
        linear-gradient(
          135deg,
          #fff9e8 0%,
          #f4fff2 35%,
          #eefbf5 70%,
          #f8fff3 100%
        );

      color:#243326;
    }

    /* =========================
       BACKGROUND GLOWS
    ========================= */

    .glow{
      position:absolute;

      width:500px;
      height:500px;

      border-radius:50%;

      filter:blur(120px);

      z-index:0;

      pointer-events:none;
    }

    .glow.one{
      background:rgba(124,182,92,0.18);

      top:-180px;
      left:-180px;
    }

    .glow.two{
      background:rgba(255,214,102,0.16);

      bottom:-180px;
      right:-180px;
    }

    /* =========================
       FLOATING PARTICLES
    ========================= */

    .particle{
      position:absolute;

      border-radius:50%;

      background:
        rgba(123,191,89,0.15);

      animation:
        float 12s linear infinite;

      pointer-events:none;
    }

    .particle:nth-child(1){
      width:14px;
      height:14px;
      left:10%;
      animation-duration:13s;
    }

    .particle:nth-child(2){
      width:8px;
      height:8px;
      left:22%;
      animation-duration:18s;
      animation-delay:2s;
    }

    .particle:nth-child(3){
      width:18px;
      height:18px;
      left:40%;
      animation-duration:15s;
    }

    .particle:nth-child(4){
      width:10px;
      height:10px;
      left:58%;
      animation-duration:20s;
      animation-delay:3s;
    }

    .particle:nth-child(5){
      width:16px;
      height:16px;
      left:74%;
      animation-duration:14s;
    }

    .particle:nth-child(6){
      width:12px;
      height:12px;
      left:88%;
      animation-duration:17s;
      animation-delay:1s;
    }

    @keyframes float{

      from{
        transform:
          translateY(110vh)
          scale(1);

        opacity:0;
      }

      15%{
        opacity:1;
      }

      85%{
        opacity:1;
      }

      to{
        transform:
          translateY(-20vh)
          scale(1.4);

        opacity:0;
      }

    }

    /* =========================
       CARD
    ========================= */

    .card{
      position:relative;

      z-index:5;

      width:92%;
      max-width:650px;

      padding:50px 40px;

      border-radius:38px;

      text-align:center;

      background:
        rgba(255,255,255,0.58);

      border:
        1px solid rgba(255,255,255,0.82);

      backdrop-filter:blur(24px);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.08);

      overflow:hidden;
    }

    /* =========================
       FLOATING FRUITS
    ========================= */

    .fruit{
      position:absolute;

      font-size:42px;

      animation:
        levitate 5s ease-in-out infinite;
    }

    .fruit.one{
      top:20px;
      left:26px;
    }

    .fruit.two{
      top:24px;
      right:30px;

      animation-delay:1s;
    }

    .fruit.three{
      bottom:24px;
      left:40px;

      animation-delay:2s;
    }

    .fruit.four{
      bottom:20px;
      right:34px;

      animation-delay:3s;
    }

    @keyframes levitate{

      0%{
        transform:
          translateY(0px)
          rotate(0deg);
      }

      50%{
        transform:
          translateY(-10px)
          rotate(6deg);
      }

      100%{
        transform:
          translateY(0px)
          rotate(0deg);
      }

    }

    /* =========================
       TEXT
    ========================= */

    .error{
      font-size:120px;

      font-weight:800;

      line-height:1;

      letter-spacing:-0.08em;

      margin-bottom:14px;

      background:
        linear-gradient(
          135deg,
          #5c8f3b,
          #f0c94d
        );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    h1{
      font-size:42px;

      line-height:1.1;

      margin-bottom:16px;
    }

    p{
      max-width:500px;

      margin:0 auto;

      line-height:1.7;

      color:rgba(36,51,38,0.72);

      font-size:16px;
    }

    .highlight{
      color:#5fa86d;

      font-weight:700;
    }

    /* =========================
       BUTTON
    ========================= */

    .home-btn{
      margin-top:34px;

      border:none;

      background:
        linear-gradient(
          135deg,
          #7bbf59,
          #5fa86d
        );

      color:white;

      padding:16px 26px;

      border-radius:20px;

      font-size:15px;

      font-weight:700;

      cursor:pointer;

      transition:
        transform .25s ease,
        box-shadow .25s ease;

      box-shadow:
        0 14px 30px rgba(124,182,92,0.22);
    }

    .home-btn:hover{
      transform:
        translateY(-3px)
        scale(1.03);

      box-shadow:
        0 18px 40px rgba(124,182,92,0.28);
    }

    /* =========================
       REDIRECT TEXT
    ========================= */

    .redirect{
      margin-top:18px;

      font-size:13px;

      color:
        rgba(36,51,38,0.5);
    }

    .countdown{
      font-weight:700;

      color:#5c8f3b;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:640px){

      .card{
        padding:42px 24px;
      }

      .error{
        font-size:92px;
      }

      h1{
        font-size:34px;
      }

      p{
        font-size:15px;
      }

      .fruit{
        font-size:34px;
      }

    }

  </style>
</head>
<body>

  <!-- PARTICLES -->

  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <!-- GLOWS -->

  <div class="glow one"></div>
  <div class="glow two"></div>

  <!-- CARD -->

  <div class="card">

    <!-- FLOATING FRUITS -->

    <div class="fruit one">🍋</div>
    <div class="fruit two">🥑</div>
    <div class="fruit three">🍓</div>
    <div class="fruit four">🥝</div>

    <div class="error">
      404
    </div>

    <h1>
      Ups… tento recept jsme nenašli 😕
    </h1>

    <p>
      Stránka kterou hledáš pravděpodobně
      někdo <span class="highlight">
      snědl
      </span>
      nebo nikdy neexistovala.
    </p>

    <button
      class="home-btn"
      onclick="goHome()"
    >
      Zpět na hlavní stránku
    </button>

    <div class="redirect">
      Automatický návrat za
      <span
        class="countdown"
        id="countdown"
      >
        8
      </span>
      sekund
    </div>

  </div>

  <script>

    function goHome(){

      window.location.href = "/";

    }

    let seconds = 8;

    const countdown =
      document.getElementById(
        "countdown"
      );

    const interval =
      setInterval(() => {

        seconds--;

        countdown.innerText =
          seconds;

        if(seconds <= 0){

          clearInterval(interval);

          goHome();

        }

      },1000);

  </script>

</body>
</html>
