<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="login-card">
    <h1>Admin přihlášení</h1>

    <input id="email" type="email" placeholder="email">
    <input id="password" type="password" placeholder="heslo">

    <button id="loginBtn">Přihlásit</button>

    <p id="error" class="error"></p>
  </div>

  <!-- LOGIN JS -->
  <script>
    const supabaseUrl = 'https://qtilqibkdouaztehzauj.supabase.co';
    const supabaseKey = 'sb_publishable_Jpe7m1sYMWkT7FEsLn2Unw_IR3Joykt';

    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('error');

    // pokud už je přihlášený → rovnou admin
    (async () => {
      const { data } = await supabaseClient.auth.getSession();

      if (data.session) {
        window.location.href = 'admin.html';
      }
    })();

    loginBtn.addEventListener('click', login);

    async function login() {
      errorEl.textContent = '';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email.value,
        password: password.value
      });

      if (error) {
        errorEl.textContent = 'Špatný email nebo heslo';
        return;
      }

      window.location.href = 'admin.html';
    }
  </script>

</body>
</html>
