<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zdravá Svačinka | Již brzy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #1d2b22 0%, #0b0f0c 55%);
      color: #f5f5f5;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .background-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(115, 255, 140, 0.08);
      filter: blur(120px);
      border-radius: 50%;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .badge {
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      margin-bottom: 24px;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c6ffd1;
    }

      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 1;
      margin-bottom: 24px;
      font-weight: 700;
      letter-spacing: -0.05em;
    }
