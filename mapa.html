<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />

  <title>Mapa | Zdravá Svačinka</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mapa.css">
</head>

<body>

<div class="background-glow"></div>
<div class="background-glow second"></div>

  <nav class="navbar">

  <div class="logo">
    Zdravá Svačinka
  </div>

  <button class="menu-toggle" id="menu-toggle">
    ☰
  </button>

  <div class="nav-links" id="nav-links">
    <a href="index.html">Domů</a>
    <a href="recepty.html">Recepty</a>
    <a href="mapa.html" class="active">Mapa</a>
    <a href="feedback.html">Feedback</a>
    <a href="info.html">Info</a>
  </div>

  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Interaktivní mapa</h1>
    <p>Vyber patro a předregistruj se na jednotlivé stánky</p>
  </section>

  <!-- FLOOR SELECT -->
  <section class="floor-select">
    <button onclick="switchFloor('1')">1. patro</button>
    <button onclick="switchFloor('2')">2. patro</button>
    <button onclick="switchFloor('3')">3. patro</button>
    <button onclick="switchFloor('dvorek')">Altánek</button>
  </section>

  <!-- MAP AREA -->
  <section class="map-wrapper">

    <div class="map-placeholder" id="map">

  <img
    id="map-image"
    src="images/1p.png"
    alt="Mapa 1. patra"
  >
      <button class="stanek1" onclick="openStand()"></button>

  <div id="map-text">
    1. patro
  </div>

</div>

  </section>

  <div class="popup" id="popup">

  <div class="popup-content">

    <button class="close-popup" onclick="closePopup()">
      ✕
    </button>

    <h2>Stánek s jídlem</h2>

    <ul>
      <li>Vajíčková pomazánka</li>
    </ul>

    <a href="recepty.html" class="popup-button">
      Zobrazit recept
    </a>

  </div>

</div>
  
  <!-- FOOTER -->
  <footer>
    <p>© 2026 sledujte nás na instagramu @tercie._.gymbos • web created by @frantishkk</p>
  </footer>

  <script src="mapa.js"></script>

</body>
</html>
