<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newsletter potvrzen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff9e8 0%,
          #f4fff2 30%,
          #eefbf5 65%,
          #f8fff3 100%
        );

      animation: backgroundShift 20s ease infinite;
      background-size: 300% 300%;

      color: #243326;

      min-height: 100vh;
      overflow: hidden;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    @keyframes backgroundShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .background-glow {
      position: absolute;

      width: 500px;
      height: 500px;

      background: rgba(124, 182, 92, 0.18);

      filter: blur(120px);

      border-radius: 50%;

      top: -120px;
      left: 50%;

      transform: translateX(-50%);

      animation: floatGlow 12s ease-in-out infinite;

      z-index: 0;
    }

    .background-glow.second {
      width: 420px;
      height: 420px;

      background: rgba(255, 214, 102, 0.16);

      right: 5%;
      left: auto;
      top: 40%;

      animation: floatGlowReverse 16s ease-in-out infinite;
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translateX(-50%) translateY(0px);
      }

      50% {
        transform: translateX(-45%) translateY(30px);
      }
    }

    @keyframes floatGlowReverse {
      0%, 100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-40px);
      }
    }

    .card {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 600px;

      background: rgba(255,255,255,0.58);

      border: 1px solid rgba(124,182,92,0.12);

      backdrop-filter: blur(14px);

      border-radius: 32px;

      padding: 60px 40px;

      text-align: center;

      box-shadow: 0 10px 40px rgba(36,51,38,0.06);
    }

    .badge {
      display: inline-block;

      padding: 10px 18px;

      border-radius: 999px;

      background: rgba(255,255,255,0.6);

      border: 1px solid rgba(124,182,92,0.14);

      font-size: 13px;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      color: #5c8f3b;

      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(3rem, 6vw, 5rem);

      line-height: 1;

      margin-bottom: 24px;

      font-weight: 700;

      letter-spacing: -0.05em;

      color: #243326;
    }

    p {
      font-size: 18px;

      line-height: 1.7;

      color: rgba(36,51,38,0.72);

      margin-bottom: 40px;
    }

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 16px 28px;

      border-radius: 16px;

      text-decoration: none;

      font-size: 15px;
      font-weight: 600;

      background: linear-gradient(135deg, #7bbf59, #5fa86d);

      color: white;

      transition: 0.25s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

  </style>
</head>

<body>

  <div class="background-glow"></div>
  <div class="background-glow second"></div>

  <div class="card">

    <div class="badge">
      Newsletter
    </div>

    <h1>
      Děkujeme 💌
    </h1>

    <p>
      Tvůj email byl úspěšně potvrzen.<br>
      Brzy ti pošleme další novinky o projektu Zdravá Svačinka.
    </p>

    <a href="index.html" class="button">
      Zpět na úvodní stránku
    </a>

  </div>

</body>
</html>
