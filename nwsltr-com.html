<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newsletter potvrzen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #eefcf4 0%, #dff4ff 25%, #d9e8ff 55%, #efe1ff 100%);
      animation: backgroundShift 18s ease infinite;
      background-size: 400% 400%;
      color: #18202b;
      min-height: 100vh;
      overflow: hidden;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    @keyframes backgroundShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .background-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(129, 181, 255, 0.28);
      filter: blur(120px);
      border-radius: 50%;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      animation: floatGlow 12s ease-in-out infinite;
      z-index: 0;
    }

    .background-glow.second {
      width: 420px;
      height: 420px;
      background: rgba(174, 119, 255, 0.22);
      right: 5%;
      left: auto;
      top: 40%;
      animation: floatGlowReverse 16s ease-in-out infinite;
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translateX(-50%) translateY(0px);
      }

      50% {
        transform: translateX(-45%) translateY(30px);
      }
    }

    @keyframes floatGlowReverse {
      0%, 100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-40px);
      }
    }

    .card {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 600px;

      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.7);

      backdrop-filter: blur(14px);

      border-radius: 32px;

      padding: 60px 40px;

      text-align: center;

      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    .badge {
      display: inline-block;

      padding: 10px 18px;

      border-radius: 999px;

      background: rgba(255,255,255,0.6);

      border: 1px solid rgba(255,255,255,0.7);

      font-size: 13px;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      color: #7c3aed;

      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(3rem, 6vw, 5rem);

      line-height: 1;

      margin-bottom: 24px;

      font-weight: 700;

      letter-spacing: -0.05em;
    }

    p {
      font-size: 18px;

      line-height: 1.7;

      color: rgba(24,32,43,0.72);

      margin-bottom: 40px;
    }

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 16px 28px;

      border-radius: 16px;

      text-decoration: none;

      font-size: 15px;
      font-weight: 600;

      background: linear-gradient(135deg, #5da8ff, #8b5cf6);

      color: #18202b;

      transition: 0.25s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

  </style>
</head>

<body>

  <div class="background-glow"></div>
  <div class="background-glow second"></div>

  <div class="card">

    <div class="badge">
      Newsletter
    </div>

    <h1>
      Děkujeme 💌
    </h1>

    <p>
      Tvůj email byl úspěšně potvrzen.<br>
      Brzy ti pošleme další novinky o projektu Zdravá Svačinka.
    </p>

    <a href="index.html" class="button">
      Zpět na úvodní stránku
    </a>

  </div>

</body>
</html>
