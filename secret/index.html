<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SECRET</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;

      background: linear-gradient(135deg,
        #fff9e8,
        #f4fff2,
        #eefbf5,
        #f8fff3
      );

      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      position: relative;
    }

    /* GLOW BACKGROUND */
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      z-index: 0;
      animation: float 10s infinite ease-in-out;
    }

    .glow.green {
      background: #7bbf59;
      top: -150px;
      left: -120px;
    }

    .glow.yellow {
      background: #ffe082;
      bottom: -150px;
      right: -120px;
      animation-delay: 3s;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-40px); }
    }

    /* MAIN CARD */
    .container {
      position: relative;
      z-index: 2;

      width: 90%;
      max-width: 800px;

      text-align: center;

      padding: 40px;

      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(124,182,92,0.15);
      backdrop-filter: blur(12px);

      border-radius: 30px;

      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }

    .badge {
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #5c8f3b;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(2.8rem, 6vw, 5rem);
      color: #243326;
      margin-bottom: 20px;
      animation: glitch 4s infinite;
    }

    /* GLITCH EFFECT */
    @keyframes glitch {
      0%,100% { transform: translate(0); }
      20% { transform: translate(-2px,2px); }
      40% { transform: translate(2px,-2px); }
      60% { transform: translate(-1px,1px); }
      80% { transform: translate(1px,-1px); }
    }

    /* TERMINAL */
    .terminal {
      text-align: left;
      font-family: 'Space Mono', monospace;
      color: #5c8f3b;

      background: rgba(255,255,255,0.5);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(124,182,92,0.15);

      margin-bottom: 20px;
    }

    .line {
      opacity: 0;
      animation: appear 0.5s forwards;
      margin-bottom: 8px;
    }

    .line:nth-child(1){ animation-delay: 1s; }
    .line:nth-child(2){ animation-delay: 1.8s; }
    .line:nth-child(3){ animation-delay: 2.6s; }
    .line:nth-child(4){ animation-delay: 3.4s; }

    @keyframes appear {
      to { opacity: 1; }
    }

    /* SECRET MESSAGE */
    .message {
      font-size: 14px;
      color: rgba(36,51,38,0.6);
      margin-bottom: 20px;
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0%,100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* INPUT */
    input {
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(124,182,92,0.2);
      width: 100%;
      max-width: 300px;
      text-align: center;
      font-family: 'Space Mono', monospace;
      outline: none;
      margin-top: 10px;
    }

    input:focus {
      box-shadow: 0 0 0 4px rgba(124,182,92,0.1);
      border-color: #7bbf59;
    }

  </style>
</head>

<body>

  <div class="glow green"></div>
  <div class="glow yellow"></div>

  <div class="container">

    <div class="badge">ZDRAVÁ SVAČINKA 2026 • SECRET PAGE</div>

    <h1 id="title"></h1>

    <div class="terminal">
      <div class="line">> loading recipes...</div>
      <div class="line">> connecting cafeteria...</div>
      <div class="line">> preparing snacks...</div>
      <div class="line">> ordering ingredients</div>
    </div>

    <div class="message" id="msg">recipe database initializing...</div>

    <input id="code" placeholder="ENTER ACCESS CODE">

  </div>

  <script>

    /* RANDOM MESSAGES */
    const messages = [
      "recipe database unlocked",
      "cafeteria sync complete",
      "healthy snacks detected",
      "qr system online",
      "launch sequence started",
      "secret menu loading",
      "pokud tohle čteš, tak patříš mezi 1% lidí",
      "oliver ti vzkazuje ať máš hezký den"
    ];

    const msg = document.getElementById("msg");

    setInterval(() => {
      msg.innerText =
        messages[Math.floor(Math.random() * messages.length)];
    }, 2500);

    /* ACCESS CODE */
    const input = document.getElementById("code");

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {

        if (input.value.toLowerCase() === "oliverovynohy") {
          alert("ACCESS GRANTED 👀");
        } else {
          alert("ACCESS DENIED");
        }

      }
    });

  </script>

</script>
</body>
</html>
