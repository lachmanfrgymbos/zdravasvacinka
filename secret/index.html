<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>COMING SOON</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff9e8 0%,
          #f4fff2 30%,
          #eefbf5 65%,
          #f8fff3 100%
        );

      background-size: 300% 300%;

      animation: backgroundShift 20s ease infinite;

      min-height: 100vh;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    @keyframes backgroundShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .background-glow {
      position: absolute;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      filter: blur(120px);

      opacity: 0.5;

      z-index: 0;

      animation: float 14s ease-in-out infinite;
    }

    .background-glow.one {
      background: rgba(124, 182, 92, 0.25);

      top: -150px;
      left: -100px;
    }

    .background-glow.two {
      background: rgba(255, 214, 102, 0.2);

      bottom: -180px;
      right: -120px;

      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-40px);
      }
    }

    .container {
      position: relative;
      z-index: 2;

      text-align: center;

      padding: 40px;

      backdrop-filter: blur(12px);

      background: rgba(255,255,255,0.4);

      border: 1px solid rgba(124,182,92,0.1);

      border-radius: 32px;

      box-shadow:
        0 10px 40px rgba(36,51,38,0.08);

      max-width: 750px;
      width: 90%;
    }

    .badge {
      display: inline-block;

      padding: 10px 18px;

      border-radius: 999px;

      background: rgba(255,255,255,0.7);

      border: 1px solid rgba(124,182,92,0.14);

      color: #5c8f3b;

      font-size: 13px;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      margin-bottom: 28px;

      backdrop-filter: blur(10px);
    }

    h1 {
      font-family: 'Space Mono', monospace;

      font-size: clamp(3rem, 7vw, 6rem);

      color: #243326;

      letter-spacing: 0.08em;

      margin-bottom: 22px;

      min-height: 120px;
    }

    .cursor {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .subtitle {
      font-size: 1.2rem;

      color: rgba(36,51,38,0.72);

      line-height: 1.8;

      margin-bottom: 28px;
    }

    .credits {
      font-size: 15px;

      color: rgba(36,51,38,0.55);

      letter-spacing: 0.08em;
    }

    .particles {
      position: absolute;
      inset: 0;

      overflow: hidden;

      z-index: 1;

      pointer-events: none;
    }

    .particle {
      position: absolute;

      width: 6px;
      height: 6px;

      background: rgba(124,182,92,0.22);

      border-radius: 50%;

      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      from {
        transform: translateY(100vh);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      to {
        transform: translateY(-100px);
        opacity: 0;
      }
    }

    @media (max-width: 640px) {

      .container {
        padding: 32px 24px;
      }

      .subtitle {
        font-size: 1rem;
      }

    }

  </style>
</head>
<body>

  <div class="background-glow one"></div>
  <div class="background-glow two"></div>

  <div class="particles"></div>

  <main class="container">

    <div class="badge">
      ZDRAVÁ SVAČINKA 2026 • SECRET
    </div>

    <h1 id="typing"></h1>

    <p class="subtitle">
      něco se připravuje 👀
      <br>
      stay tuned...
    </p>

    <div class="credits">
      by @tercie._.gymbos
    </div>

  </main>

  <script>

    const text = 'COMING SOON';
    const typingElement = document.getElementById('typing');

    let index = 0;

    function typeWriter() {

      if (index < text.length) {

        typingElement.innerHTML =
          text.substring(0, index + 1) +
          '<span class="cursor">|</span>';

        index++;

        setTimeout(typeWriter, 140);

      }
    }

    typeWriter();

    const particlesContainer = document.querySelector('.particles');

    for (let i = 0; i < 40; i++) {

      const particle = document.createElement('div');

      particle.classList.add('particle');

      particle.style.left = Math.random() * 100 + 'vw';

      particle.style.animationDuration =
        (Math.random() * 10 + 10) + 's';

      particle.style.animationDelay =
        Math.random() * 10 + 's';

      particle.style.opacity = Math.random();

      particlesContainer.appendChild(particle);
    }

  </script>

</body>
</html>
